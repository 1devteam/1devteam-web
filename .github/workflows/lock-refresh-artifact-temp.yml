name: Lock refresh artifact
on:
  push:
    branches:
      - fix/canonical-graft-service-boundary-20261005
permissions:
  contents: read
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh Wrangler and lockfile
        run: npm install --save-dev wrangler@4.146.0
      - name: Verify dependency audits
        run: |
          npm run audit:prod-deps
          npm run audit:deps
      - name: Validate code path
        run: |
          npm run lint
          npm run audit:contrast
          npm run audit:seo
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: secure-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
