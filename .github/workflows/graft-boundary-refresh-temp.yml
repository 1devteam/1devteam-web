name: GRAFT boundary dependency refresh
on:
  push:
    branches:
      - fix/canonical-graft-service-boundary-20261005
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message == 'chore: refresh secure Cloudflare dev toolchain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/canonical-graft-service-boundary-20261005
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --save-dev wrangler@4.146.0
      - run: npm run audit:prod-deps
      - run: npm run audit:deps
      - run: npm run lint
      - run: npm run build
      - name: Commit lockfile refresh
        run: |
          git config user.name '1devteam'
          git config user.email 'inmo.ai@outlook.com'
          git add package.json package-lock.json
          git commit -m 'chore: refresh secure Cloudflare dev toolchain'
          git push origin HEAD:fix/canonical-graft-service-boundary-20261005
