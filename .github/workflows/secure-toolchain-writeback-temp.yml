name: Secure toolchain writeback
on:
  push:
    branches:
      - fix/canonical-graft-service-boundary-20261005
permissions:
  contents: write
jobs:
  writeback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/canonical-graft-service-boundary-20261005
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh and validate exact toolchain
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: refresh secure Cloudflare dev toolchain" ]; then
            echo "generated commit already present"
            exit 0
          fi
          npm install --save-dev wrangler@4.146.0
          npm run audit:prod-deps
          npm run audit:deps
          npm run lint
          npm run audit:contrast
          npm run audit:seo
          npm run build
          git config user.name '1devteam'
          git config user.email 'inmo.ai@outlook.com'
          git add package.json package-lock.json
          git commit -m 'chore: refresh secure Cloudflare dev toolchain'
          git push origin HEAD:fix/canonical-graft-service-boundary-20261005
