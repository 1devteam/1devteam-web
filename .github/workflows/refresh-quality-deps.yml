name: Refresh quality dependencies

on:
  push:
    branches:
      - content/ownership-and-redundancy
    paths:
      - .github/workflows/refresh-quality-deps.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/ownership-and-redundancy
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh audited development dependencies
        run: |
          npm install --save-dev @axe-core/playwright@latest wrangler@latest --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=moderate
      - name: Remove one-shot workflow and commit lockfile
        run: |
          rm .github/workflows/refresh-quality-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/refresh-quality-deps.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh audited quality dependencies"
          git push origin HEAD:content/ownership-and-redundancy
