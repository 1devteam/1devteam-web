name: Refresh lockfile

on:
  push:
    branches:
      - content/ownership-and-redundancy
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh patched React Router lock entries
        run: npm install --package-lock-only --ignore-scripts react-router-dom@7.18.2

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Synchronize patched React Router lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
